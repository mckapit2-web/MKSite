<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume | Marina Kapitanov</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --red: #b72932;
      --ink: #050505;
      --offwhite: #f4f5f5;
      --white: #fff;
      --max: 916px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: var(--offwhite);
      color: var(--ink);
      font-family: "Quicksand", Arial, sans-serif;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .hero {
      background: var(--red);
      color: var(--white);
    }

    .hero-inner {
      width: min(var(--max), calc(100vw - 48px));
      margin: 0 auto;
      min-height: 255px;
      padding: 43px 0 47px;
      position: relative;
    }

    .brand-mark {
      display: inline-block;
      margin-bottom: 48px;
    }

    .brand-mark img {
      display: block;
      width: 80px;
      height: 87px;
      object-fit: contain;
    }

    .header-links {
      position: absolute;
      top: 48px;
      right: 10px;
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .header-links a {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      background: #f3f3f3;
      color: #555;
    }

    .header-links a.linkedin {
      background: #0a66c2;
      color: #fff;
    }

    .header-links svg {
      width: 16px;
      height: 16px;
    }

    h1 {
      margin: 0;
      font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
      font-weight: 400;
      font-size: 74px;
      line-height: 1;
      letter-spacing: -3px;
    }

    main {
      width: min(var(--max), calc(100vw - 48px));
      margin: 0 auto;
      padding: 72px 0 110px;
    }

    .resume-frame {
      width: min(552px, 100%);
      height: 620px;
      margin: 0 auto;
      border: 1px solid #d9d9d9;
      background: #fff;
      box-shadow: 0 0 0 8px #ececee;
    }

    .resume-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .resume-actions {
      width: min(552px, 100%);
      margin: 32px auto 0;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-family: Georgia, serif;
      color: var(--red);
      font-size: 17px;
    }

    .download-btn {
      background: var(--red);
      color: #fff;
      padding: 12px 18px;
      border-radius: 3px;
      font-size: 15px;
      font-family: Georgia, serif;
    }

    .download-btn:hover {
      opacity: .9;
    }

    .note {
      margin-top: 18px;
      width: min(552px, 100%);
      margin-left: auto;
      margin-right: auto;
      color: #666;
      font-size: 14px;
      line-height: 1.45;
    }

    .back {
      display: block;
      width: min(552px, 100%);
      margin: 26px auto 0;
      text-align: right;
      text-decoration: underline;
      text-underline-offset: 3px;
      color: var(--red);
    }

    .back:hover {
      opacity: .8;
    }

    @media (max-width: 760px) {
      .hero-inner,
      main {
        width: calc(100vw - 32px);
      }

      .hero-inner {
        min-height: 220px;
        padding-top: 32px;
        padding-bottom: 34px;
      }

      .brand-mark {
        margin-bottom: 34px;
      }

      .brand-mark img {
        width: 80px;
        height: 87px;
      }

      .header-links {
        top: 32px;
        right: 0;
        gap: 15px;
      }

      h1 {
        font-size: 58px;
        letter-spacing: -2px;
      }

      main {
        padding-top: 50px;
      }

      .resume-frame {
        height: 72vh;
        min-height: 520px;
        box-shadow: 0 0 0 5px #ececee;
      }
    }
  </style>
</head>

<body>

  <header class="hero">
    <div class="hero-inner">

      <!-- Custom back/home image -->
      <a class="brand-mark" href="index.html" aria-label="Back to portfolio">
        <img
          src="res/resume_back_button.png"
          alt="Back to portfolio"
        />
      </a>

      <div class="header-links" aria-label="Contact links">

        <a
          class="linkedin"
          href="https://www.linkedin.com/in/marina-kapitanov"
          target="_blank"
          rel="noopener"
          aria-label="LinkedIn"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M6.94 8.45H3.56V20h3.38V8.45ZM5.25 3A2.02 2.02 0 1 0 5.25 7.04 2.02 2.02 0 0 0 5.25 3ZM20.44 13.37c0-3.48-1.86-5.1-4.34-5.1-2 0-2.9 1.1-3.4 1.87v-1.7H9.32V20h3.38v-5.72c0-1.5.28-2.96 2.15-2.96 1.84 0 1.87 1.73 1.87 3.05V20h3.38l.34-6.63Z"
            />
          </svg>
        </a>

        <a
          href="mailto:mckapit2@email.unc.edu"
          aria-label="Email Marina Kapitanov"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect
              x="3.2"
              y="5.2"
              width="17.6"
              height="13.6"
              rx="1.8"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M4.6 7l7.4 5.6L19.4 7"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
          </svg>
        </a>

      </div>

      <h1>Resume</h1>

    </div>
  </header>

  <main>

    <div class="resume-frame">
      <iframe
        src="resume.pdf#toolbar=1&navpanes=0&scrollbar=1"
        title="Marina Kapitanov resume preview"
      ></iframe>
    </div>

    <div class="resume-actions">
      <span>KapitanovMarinaResume 2024-08-20</span>

      <a
        class="download-btn"
        href="resume.pdf"
        download="KapitanovMarinaResume-2024-08-20.pdf"
      >
        Download
      </a>
    </div>

    <!-- Original bottom back-to-portfolio link -->
    <a class="back" href="index.html">← Back to portfolio</a>

  </main>

</body>
</html>
